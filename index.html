<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Video</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ---- Branding: change these to adjust the Lexora look ---- */
  :root {
    --brand-accent: #4f46e5;
    --brand-accent-soft: #eef2ff;
    --bg: #f6f6f4;
    --surface: #ffffff;
    --text: #17171a;
    --muted: #6b6b73;
    --border: #e6e6e3;
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --brand-accent: #818cf8;
      --brand-accent-soft: #1e1b4b;
      --bg: #0f0f12;
      --surface: #18181c;
      --text: #f2f2f4;
      --muted: #9a9aa3;
      --border: #2a2a30;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header, footer { display: none; }
  body.branded header, body.branded footer { display: flex; }
  header {
    align-items: center;
    justify-content: space-between;
    max-width: 1120px;
    width: 100%;
    margin: 0 auto;
    padding: 20px 16px 0;
  }
  .wordmark {
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -0.04em;
    color: var(--text);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .wordmark .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--brand-accent);
  }
  main {
    flex: 1;
    width: 100%;
    max-width: 1120px;
    margin: 0 auto;
    padding: 20px 16px 32px;
  }
  .player {
    position: relative;
    background: #000;
    border-radius: var(--radius);
    overflow: hidden;
    aspect-ratio: 16 / 9;
    box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 12px 40px rgba(0,0,0,.08);
  }
  video { width: 100%; height: 100%; display: block; background: #000; }
  .state {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; color: #d4d4d8; font-size: 15px; text-align: center; padding: 24px;
  }
  .spinner {
    width: 28px; height: 28px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.2); border-top-color: #fff;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .meta {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 16px; margin-top: 20px; flex-wrap: wrap;
  }
  h1 { font-size: 22px; line-height: 1.3; margin: 0 0 4px; font-weight: 600; letter-spacing: -0.02em; }
  .sub { color: var(--muted); font-size: 14px; }
  .actions { display: flex; gap: 8px; }
  button {
    font: inherit; font-size: 14px; font-weight: 500;
    padding: 9px 14px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
  }
  button:hover { border-color: var(--muted); }
  body.branded button.primary { background: var(--brand-accent); border-color: var(--brand-accent); color: #fff; }
  footer {
    justify-content: center; gap: 6px;
    padding: 0 16px 28px; color: var(--muted); font-size: 13px;
  }
  footer strong { color: var(--text); font-weight: 600; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <header>
    <span class="wordmark"><span class="dot"></span>lexora</span>
  </header>

  <main>
    <div class="player">
      <video id="video" controls playsinline preload="metadata" hidden></video>
      <div class="state" id="state"><div class="spinner"></div><div id="stateText">Video wird geladen …</div></div>
    </div>
    <div class="meta" id="meta" hidden>
      <div>
        <h1 id="title"></h1>
        <div class="sub" id="sub"></div>
      </div>
      <div class="actions">
        <button class="primary" id="copy">Link kopieren</button>
      </div>
    </div>
  </main>

  <footer>Erstellt von <strong>Lexora</strong></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.6.16/hls.min.js"></script>
<script>
  const SUPABASE_URL = "https://xtgydesbqrbtkabcvapi.supabase.co";
  const SUPABASE_KEY = "sb_publishable_BTPyIEezkU4wmbixtGAnRA_USdGheMJ";

  const id = new URLSearchParams(location.search).get("v") || "";
  const $ = (s) => document.getElementById(s);

  function showState(text, spinning) {
    $("state").hidden = false;
    $("state").querySelector(".spinner").hidden = !spinning;
    $("stateText").textContent = text;
  }

  function formatDuration(sec) {
    if (!sec) return "";
    const s = Math.round(sec);
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")} min`;
  }

  async function fetchVideo() {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/videos?id=eq.${encodeURIComponent(id)}&select=id,title,branding,duration_seconds,completed_at,created_at`, {
      headers: { apikey: SUPABASE_KEY },
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const rows = await res.json();
    return rows[0] || null;
  }

  function play(video) {
    const src = `${SUPABASE_URL}/storage/v1/object/public/videos/${video.id}/playlist.m3u8`;
    const el = $("video");
    if (el.canPlayType("application/vnd.apple.mpegurl")) {
      el.src = src;
    } else if (window.Hls && Hls.isSupported()) {
      const hls = new Hls();
      hls.loadSource(src);
      hls.attachMedia(el);
      hls.on(Hls.Events.ERROR, (_, data) => {
        if (data.fatal) showState("Das Video konnte nicht abgespielt werden.", false);
      });
    } else {
      showState("Dieser Browser kann das Video leider nicht abspielen.", false);
      return;
    }
    el.hidden = false;
    $("state").hidden = true;
  }

  function render(video) {
    document.body.classList.toggle("branded", !!video.branding);
    document.title = video.title + (video.branding ? " · Lexora" : "");
    $("title").textContent = video.title;
    const date = new Date(video.completed_at || video.created_at)
      .toLocaleDateString("de-AT", { day: "numeric", month: "long", year: "numeric" });
    $("sub").textContent = [date, formatDuration(video.duration_seconds)].filter(Boolean).join(" · ");
    $("meta").hidden = false;
    play(video);
  }

  $("copy").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(location.href);
      $("copy").textContent = "Kopiert ✓";
      setTimeout(() => ($("copy").textContent = "Link kopieren"), 2000);
    } catch { /* clipboard blocked: ignore */ }
  });

  async function init() {
    if (!/^[a-z0-9]{16}$/.test(id)) {
      showState("Dieser Link ist ungültig.", false);
      return;
    }
    // A video becomes visible once its upload has finished, so poll briefly
    // in case the link was opened while the last part was still uploading.
    for (let attempt = 0; attempt < 40; attempt++) {
      try {
        const video = await fetchVideo();
        if (video) return render(video);
        showState("Das Video wird gerade fertig hochgeladen …", true);
      } catch {
        showState("Verbindungsproblem, neuer Versuch …", true);
      }
      await new Promise((r) => setTimeout(r, 3000));
    }
    showState("Video nicht gefunden.", false);
  }
  init();
</script>
</body>
</html>
